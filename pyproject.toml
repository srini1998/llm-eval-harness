[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Regression-gated evaluation of grounded question answering with a calibrated local LLM judge"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
evalh = "evalh.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "evalh"
